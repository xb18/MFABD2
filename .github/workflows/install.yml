name: install

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
      - "resource/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
      - "resource/**"
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          is_tag_push=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            is_tag_push=true
          fi
          
          if [ "$is_tag_push" = true ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            latest_tag=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "v0.0.0")
            commit_short=$(git rev-parse --short HEAD)
            date_suffix=$(date +"%y%m%d")
            tag="${latest_tag}-ci.${date_suffix}-${commit_short}"
          fi
          
          if [ "$is_tag_push" = true ]; then
            is_dev_version=false
          else
            is_dev_version=true
          fi

          # 获取上一个正式版标签
          prev_tag=$(git describe --tags --match "v*" --abbrev=0 ${{ github.ref }}^ 2>/dev/null || echo "")
          echo "prev_tag=${prev_tag}" | tee -a $GITHUB_OUTPUT
          echo "tag=$tag" | tee -a $GITHUB_OUTPUT
          echo "is_tag_push=$is_tag_push" | tee -a $GITHUB_OUTPUT
          echo "is_dev_version=$is_dev_version" | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      prev_tag: ${{ steps.set_tag.outputs.prev_tag }}
      is_tag_push: ${{ steps.set_tag.outputs.is_tag_push }}
      is_dev_version: ${{ steps.set_tag.outputs.is_dev_version }}

  install:
    needs: [meta]
    runs-on: macos-latest
    strategy:
      matrix:
        os: [win, macos, linux, android]
        arch: [aarch64, x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # ========== 为Linux/macOS安装Rust ==========
      - name: Setup Rust toolchain
        if: matrix.os == 'linux' || matrix.os == 'macos'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: rust-src

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.os }}-${{ matrix.arch }}*"
          latest: true
          out-file-path: "deps"
          extract: true

      - name: Download MFAAvalonia
        if: matrix.os != 'android'
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: SweetSmellFox/MFAAvalonia
          fileName: "MFAAvalonia-*-${{ (matrix.os == 'win' && 'win') || (matrix.os == 'macos' && 'osx') || (matrix.os == 'linux' && 'linux') }}-${{ (matrix.arch == 'x86_64' && 'x64') || (matrix.arch == 'aarch64' && 'arm64') }}*"
          latest: true
          out-file-path: "MFA"
          extract: true

      - name: Clean up MFAAvalonia archive
        if: matrix.os != 'android'
        shell: bash
        run: |
          ARCHIVE_FILE_PATH="${{ fromJson(steps.download_mfa.outputs.downloaded_files)[0] }}"
          rm -f "${ARCHIVE_FILE_PATH}"

      # ========== 变更日志生成 ==========
      - name: Generate Changelog for App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 确保安装 git-cliff（指定稳定版本）
          if [[ "${{ matrix.os }}" == "win" ]]; then
            # Windows平台使用预编译版本
            curl -L https://github.com/orhun/git-cliff/releases/download/v1.4.1/git-cliff-1.4.1-x86_64-pc-windows-msvc.zip -o git-cliff.zip
            unzip git-cliff.zip
            chmod +x git-cliff.exe
            ./git-cliff.exe --version
          else
            # Linux/macOS使用cargo安装
            cargo install git-cliff --version 1.4.1
          fi
          
          # 生成当前版本的变更日志
          if [ -n "${{ needs.meta.outputs.prev_tag }}" ]; then
            echo "生成变更日志从 ${{ needs.meta.outputs.prev_tag }} 到 HEAD"
            if [[ "${{ matrix.os }}" == "win" ]]; then
              ./git-cliff.exe --config .github/cliff.toml \
                --tag "${{ needs.meta.outputs.tag }}" \
                --unreleased \
                --include-path '*.py' '*.md' 'assets/*' \
                --output resource/Changelog.md \
                ${{ needs.meta.outputs.prev_tag }}..HEAD
            else
              git-cliff --config .github/cliff.toml \
                --tag "${{ needs.meta.outputs.tag }}" \
                --unreleased \
                --include-path '*.py' '*.md' 'assets/*' \
                --output resource/Changelog.md \
                ${{ needs.meta.outputs.prev_tag }}..HEAD
            fi
          else
            echo "生成完整变更日志"
            if [[ "${{ matrix.os }}" == "win" ]]; then
              ./git-cliff.exe --config .github/cliff.toml \
                --tag "${{ needs.meta.outputs.tag }}" \
                --output resource/Changelog.md
            else
              git-cliff --config .github/cliff.toml \
                --tag "${{ needs.meta.outputs.tag }}" \
                --output resource/Changelog.md
            fi
          fi
          
          echo "✅ 应用变更日志已生成"
      # ====================================

      - name: Install
        shell: bash
        run: |
          python ./install.py ${{ needs.meta.outputs.tag }}

          if [[ "${{ matrix.os }}" != "android" ]]; then
            if [ -d "MFA" ]; then
              mkdir -p install
              rsync -av --ignore-existing MFA/ install/
            fi
          fi
          
          if [ -f "resource/Changelog.md" ]; then
            mkdir -p install/resource
            cp resource/Changelog.md install/resource/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MFABD2-${{ matrix.os }}-${{ matrix.arch }}
          path: "install"

  changelog:
    name: Generate changelog for Release
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_body: ${{ steps.generate-changelog.outputs.release_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========== 安装Rust ==========
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: rust-src, llvm-tools-preview

      # ========== 发布变更日志生成 ==========
      - name: Generate changelog for Release
        id: generate-changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 确保安装 git-cliff（指定稳定版本）
          cargo install git-cliff --version 1.4.1
          
          # 生成变更日志
          if [ -n "${{ needs.meta.outputs.prev_tag }}" ]; then
            git-cliff --config .github/cliff.toml \
              --tag "${{ needs.meta.outputs.tag }}" \
              --unreleased \
              --include-path '*.py' '*.md' 'assets/*' \
              --output temp_changelog.md \
              ${{ needs.meta.outputs.prev_tag }}..HEAD
          else
            git-cliff --config .github/cliff.toml \
              --tag "${{ needs.meta.outputs.tag }}" \
              --output temp_changelog.md
          fi
          
          # 读取文件内容（使用GitHub Actions安全输出）
          content="$(<temp_changelog.md)"
          echo "release_body=$content" >> $GITHUB_OUTPUT
          
          echo "✅ 发布变更日志已生成"
      # ====================================

  release:
    if: (needs.meta.outputs.is_tag_push == 'true') || (github.event_name == 'workflow_dispatch' && needs.meta.outputs.is_dev_version == 'true')
    needs: [meta, install, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get current timestamp
        id: get_time
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
      
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Package release assets
        run: |
          cd artifacts
          mkdir -p release_assets
          for dir in *; do
            platform=${dir#MFABD2-}
            zip_name="MFABD2-${{ needs.meta.outputs.tag }}-${platform}.zip"
            (cd "$dir" && zip -r "../release_assets/$zip_name" .)
          done
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: artifacts/release_assets/*.zip
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "${{ needs.meta.outputs.tag }}"
          body: |
            ${{ contains(needs.changelog.outputs.release_body, '## ') && needs.changelog.outputs.release_body || '### 无显著变更' }}
            
            **构建信息**:
            - 版本: `${{ needs.meta.outputs.tag }}`
            - 类型: ${{ needs.meta.outputs.is_tag_push == 'true' && '正式版' || '开发版' }}
            - 构建时间: ${{ steps.get_time.outputs.time }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_dev_version == 'true' }}